const cats = ["All", ...new Set(templates.map(t => t.cat))];
const catColors = { Tech:"blue", Finance:"teal", Marketing:"coral", Healthcare:"green", Engineering:"purple", Legal:"amber", Education:"teal", Hospitality:"pink", Sales:"coral", HR:"purple", Logistics:"blue", Creative:"pink", Admin:"gray", Construction:"amber" };

function bgColor(c) {
  const map = { blue:"var(--color-background-info)", teal:"#E1F5EE", coral:"#FAECE7", green:"var(--color-background-success)", purple:"#EEEDFE", amber:"var(--color-background-warning)", pink:"#FBEAF0", gray:"var(--color-background-secondary)" };
  return map[c] || "var(--color-background-secondary)";
}
function txtColor(c) {
  const map = { blue:"var(--color-text-info)", teal:"#0F6E56", coral:"#993C1D", green:"var(--color-text-success)", purple:"#534AB7", amber:"var(--color-text-warning)", pink:"#993556", gray:"var(--color-text-secondary)" };
  return map[c] || "var(--color-text-secondary)";
}

let active = "All";
let expanded = null;

function renderFilters() {
  const bar = document.getElementById("filters");
  bar.innerHTML = cats.map(c =>
    `<button class="filter-btn${c===active?" active":""}" onclick="setFilter('${c}')">${c}</button>`
  ).join("");
}

function renderGrid() {
  const grid = document.getElementById("grid");
  const shown = active === "All" ? templates : templates.filter(t => t.cat === active);
  grid.innerHTML = shown.map(t => {
    const isExp = expanded === t.id;
    const col = catColors[t.cat] || "gray";
    return `<div class="card${isExp?" expanded":""}" onclick="toggleCard(${t.id})">
      <div class="card-top">
        <span class="card-num">${String(t.id).padStart(2,"0")}</span>
        <span class="card-title">${t.title}</span>
        <span class="card-cat" style="background:${bgColor(col)};color:${txtColor(col)}">${t.cat}</span>
        <span class="card-chevron">${isExp?"▲":"▼"}</span>
      </div>
      <div class="card-tagline">${t.tagline}</div>
      <div class="card-detail">
        <div class="section-label">Contact fields</div>
        <div class="fields">${t.contact.map(f=>`<span class="field key">${f}</span>`).join("")}</div>
        <div class="section-label">Summary should include</div>
        <div class="fields">${t.summary.map(f=>`<span class="field">${f}</span>`).join("")}</div>
        ${t.sections.map(s=>`
          <div class="section-label">${s.name}</div>
          <div class="fields">${s.fields.map(f=>`<span class="field">${f}</span>`).join("")}</div>
        `).join("")}
        <div class="note">${t.uaeNote}</div>
      </div>
    </div>`;
  }).join("");
}

function setFilter(cat) {
  active = cat;
  expanded = null;
  renderFilters();
  renderGrid();
}

function toggleCard(id) {
  expanded = expanded === id ? null : id;
  renderGrid();
}

renderFilters();
renderGrid();
</script>
